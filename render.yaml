services:
  - type: web
    name: reelsvault
    runtime: node
    plan: free
    buildCommand: pip3 install --break-system-packages --no-cache-dir yt-dlp instaloader || pip install --break-system-packages --no-cache-dir yt-dlp instaloader || true; npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
